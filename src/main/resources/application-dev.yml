server:
   port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/alexahealthassistant

    username: ${DB_Username}
    password: ${DB_Password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:           # JPA and Hibernate configuration.
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
       hibernate:
         dialect: org.hibernate.dialect.MySQLDialect
  
  ai:
    mcp:
       server:
         name: health-assitant
         version: 0.1.0
         protocol: STREAMABLE
       client:
         initialized: false
         streamable-http:
            connections:
               health-server:
                  url: http://localhost:8080
         
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
            model: gemini-3.5-flash
    
     